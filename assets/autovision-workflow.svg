<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AutoVision AI recognition workflow">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F1A33"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3040"/><stop offset="1" stop-color="#0A2230"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#242C5C"/><stop offset="1" stop-color="#1A2048"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F3128"/><stop offset="1" stop-color="#0B2420"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2C12"/><stop offset="1" stop-color="#2C210E"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5B6CA8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="16" fill="url(#wbg)"/>
  <rect x="1" y="1" width="1198" height="558" rx="15" fill="none" stroke="#26355C"/>
  <text x="600" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#E2E8F0">Recognition Workflow</text>
  <text x="600" y="80" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#7E8DB8">From uploaded image to ranked make · model · year prediction</text>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- 1 Upload -->
    <g transform="translate(60,130)">
      <rect width="230" height="86" rx="14" fill="url(#cyan)" stroke="#1F6076" stroke-width="1.5"/>
      <circle cx="34" cy="43" r="18" fill="#0B1020" stroke="#22D3EE" stroke-width="2"/>
      <path d="M34 34 V52 M27 41 L34 34 L41 41" stroke="#67E8F9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="66" y="40" fill="#E2F5FB" font-size="16" font-weight="700">1 · Upload image</text>
      <text x="66" y="62" fill="#8DB6C7" font-size="12.5">JPG / PNG vehicle photo</text>
    </g>

    <!-- 2 Preprocess -->
    <g transform="translate(60,270)">
      <rect width="230" height="86" rx="14" fill="url(#cyan)" stroke="#1F6076" stroke-width="1.5"/>
      <circle cx="34" cy="43" r="18" fill="#0B1020" stroke="#22D3EE" stroke-width="2"/>
      <rect x="26" y="35" width="16" height="16" rx="3" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <text x="66" y="40" fill="#E2F5FB" font-size="16" font-weight="700">2 · Validate + preprocess</text>
      <text x="66" y="62" fill="#8DB6C7" font-size="12.5">Resize · normalise pixels</text>
    </g>

    <!-- Decision -->
    <g transform="translate(370,220)">
      <path d="M90 0 L180 55 L90 110 L0 55 Z" fill="url(#amber)" stroke="#7A5B22" stroke-width="1.5"/>
      <text x="90" y="50" text-anchor="middle" fill="#FCD9A0" font-size="14" font-weight="700">Select</text>
      <text x="90" y="70" text-anchor="middle" fill="#FCD9A0" font-size="14" font-weight="700">method</text>
    </g>

    <!-- 3a CLIP -->
    <g transform="translate(640,130)">
      <rect width="250" height="96" rx="14" fill="url(#green)" stroke="#1E6F53" stroke-width="1.5"/>
      <text x="18" y="34" fill="#6EE7B7" font-size="13" font-weight="800" letter-spacing="1">ZERO-SHOT</text>
      <text x="18" y="60" fill="#E7FBF3" font-size="16" font-weight="700">3a · CLIP inference</text>
      <text x="18" y="80" fill="#8FCFB6" font-size="12.5">Match image ↔ catalogue text</text>
    </g>

    <!-- 3b MobileNet -->
    <g transform="translate(640,330)">
      <rect width="250" height="96" rx="14" fill="url(#violet)" stroke="#3A4787" stroke-width="1.5"/>
      <text x="18" y="34" fill="#A5B4FC" font-size="13" font-weight="800" letter-spacing="1">CUSTOM MODEL</text>
      <text x="18" y="60" fill="#EDEFFF" font-size="16" font-weight="700">3b · MobileNetV2</text>
      <text x="18" y="80" fill="#AAB2E8" font-size="12.5">Trained class-folder classifier</text>
    </g>

    <!-- 4 Rank -->
    <g transform="translate(950,230)">
      <rect width="200" height="96" rx="14" fill="url(#violet)" stroke="#3A4787" stroke-width="1.5"/>
      <text x="18" y="38" fill="#EDEFFF" font-size="16" font-weight="700">4 · Rank matches</text>
      <text x="18" y="60" fill="#AAB2E8" font-size="12.5">Top-1 + alternatives,</text>
      <text x="18" y="78" fill="#AAB2E8" font-size="12.5">confidence score</text>
    </g>

    <!-- 5 Display -->
    <g transform="translate(950,400)">
      <rect width="200" height="96" rx="14" fill="url(#cyan)" stroke="#1F6076" stroke-width="1.5"/>
      <text x="18" y="38" fill="#E2F5FB" font-size="16" font-weight="700">5 · Display result</text>
      <text x="18" y="60" fill="#8DB6C7" font-size="12.5">Make · Model ·</text>
      <text x="18" y="78" fill="#8DB6C7" font-size="12.5">Year range · Score</text>
    </g>

    <!-- arrows -->
    <g stroke="#5B6CA8" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M175 216 V266"/>                              <!-- upload -> preprocess -->
      <path d="M290 312 H366"/>                              <!-- preprocess -> decision -->
      <path d="M470 250 Q560 250 636 190"/>                  <!-- decision -> CLIP -->
      <path d="M470 285 Q560 300 636 372"/>                  <!-- decision -> MobileNet -->
      <path d="M890 178 Q930 200 948 262"/>                  <!-- CLIP -> rank -->
      <path d="M890 378 Q930 340 948 300"/>                  <!-- MobileNet -> rank -->
      <path d="M1050 326 V396"/>                             <!-- rank -> display -->
    </g>
  </g>

  <!-- legend -->
  <g font-family="'Segoe UI', Arial, sans-serif" transform="translate(60,510)">
    <circle cx="6" cy="0" r="6" fill="#0E3040" stroke="#1F6076"/><text x="20" y="4" fill="#8DB6C7" font-size="12.5">Pipeline step</text>
    <circle cx="146" cy="0" r="6" fill="#0F3128" stroke="#1E6F53"/><text x="160" y="4" fill="#8FCFB6" font-size="12.5">Zero-shot path</text>
    <circle cx="296" cy="0" r="6" fill="#242C5C" stroke="#3A4787"/><text x="310" y="4" fill="#AAB2E8" font-size="12.5">Custom-model path</text>
    <circle cx="470" cy="0" r="6" fill="#3A2C12" stroke="#7A5B22"/><text x="484" y="4" fill="#FCD9A0" font-size="12.5">Decision</text>
  </g>
</svg>
